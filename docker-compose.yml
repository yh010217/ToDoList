version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "8081:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mariadb://host.docker.internal:3306/tdl
      - DB_USER=root
      - DB_PASSWORD=mariadb

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/:/etc/nginx/conf.d
    restart: always
    depends_on:
      - frontend
