name: Deploy React App

on:
  push:
    branches:
      - cicd_frontend_ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build


      - name: Get Actions IP - 이 IP로 EC2 보안그룹 임시 변경
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EC2_SECURITY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.EC2_SECURITY_ACCESS_SECRET_KEY }}
          aws-region: 'ap-northeast-2'

      - name: Add GitHub Actions IP
        run: |
          aws ec2 authorize-security-group-ingress \
              --group-id ${{ secrets.SECURITY_GROUP_ID }} \
              --protocol tcp \
              --port 22 \
              --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: 이전 파일 제거
        run: |
          sudo mkdir -p /var/www/react-app
          sudo rm -rf /var/www/react-app/*

      - name: Copy Build Files to Nginx Directory
        uses: actions/setup-linux@v1
        with:
          path: /var/www/react-app
        run: |
          sudo mkdir -p /var/www/react-app
          sudo rm -rf /var/www/react-app/*
          sudo cp -R ./build/* /var/www/react-app/
          sudo chown -R www-data:www-data /var/www/react-app

      - name: Restart Nginx
        run: sudo systemctl restart nginx

      - name: Revoke GitHub Actions IP
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32